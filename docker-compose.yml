services:
  # Local Postgres, only for offline dev away from the NAS. Not started by default -
  # the app connects to the existing NAS Postgres via DATABASE_URL in .env instead.
  # Run with: docker compose --profile local-db up
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
      POSTGRES_DB: health_tracker
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      # Telegram
      TELEGRAM_BOT_TOKEN: "123456:ABC-DEF..."
      TELEGRAM_WEBHOOK_BASE_URL: "https://your-domain.com"
      TELEGRAM_WEBHOOK_SECRET: "change-me"

      # Gemini
      GEMINI_API_KEY: "your-gemini-api-key"
      GEMINI_MODEL: "gemini-3.6-flash"

      # Optional: courtesy contact for OpenAlex's "polite pool" (search_scientific_studies) -
      # not an API key, works fine left blank.
      OPENALEX_EMAIL: ""

      # Existing Postgres (e.g. the NAS's own instance, not a container this compose file starts)
      DATABASE_URL: "postgresql://<user>:<password>@<host>:<port>/<dbname>"

      # App
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"

volumes:
  db_data:
